[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ankigen"
version = "0.2.0"
description = ""
authors = [
    { name = "Justin", email = "9146678+brickfrog@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.91.0",
    "openai-agents>=0.1.0",
    "gradio>=5.34.2",
    "tenacity>=9.1.2",
    "genanki>=0.13.1",
    "pydantic==2.10.6",
    "pandas==2.2.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.2",
    "tiktoken>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.0",
    "black>=25.1.0",
    "pre-commit>=4.2.0",
    "pytest-anyio>=0.0.0",
]

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
anyio_backend = "asyncio"
