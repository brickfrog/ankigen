[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ankigen"
version = "0.2.0"
description = ""
authors = [
    { name = "Justin", email = "9146678+brickfrog@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.109.1",
    "openai-agents>=0.3.2",
    "gradio>=5.47.0",
    "tenacity>=9.1.2",
    "genanki>=0.13.1",
    "pydantic==2.11.9",
    "pandas>=2.3.2",
    "beautifulsoup4==4.13.5",
    "lxml>=6.0.2",
    "tiktoken>=0.11.0",
    "fastmcp>=2.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.13.1",
    "black>=25.9.0",
    "pre-commit>=4.3.0",
    "pytest-anyio>=0.0.0",
]

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
anyio_backend = "asyncio"
