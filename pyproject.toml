[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ankigen"
version = "0.2.0"
description = ""
authors = [
    { name = "Justin", email = "9146678+brickfrog@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.35.10",
    "gradio>=4.44.1",
    "tenacity>=9.1.2",
    "genanki>=0.13.1",
    "pydantic==2.10.6",
    "pandas==2.2.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-mock", "ruff", "black", "pre-commit"]

[tool.setuptools]
py-modules = ["app"]
