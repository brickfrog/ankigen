[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ankigen"
version = "0.2.0"
description = "AI-powered Anki flashcard generator using OpenAI GPT models with CLI and web interface"
authors = [
    { name = "Justin", email = "9146678+brickfrog@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.21.0",
    "openai-agents>=0.9.3",
    "gradio>=6.7.0",
    "tenacity>=9.1.4",
    "genanki>=0.13.1",
    "pydantic>=2.12.5",
    "pandas>=2.3.2",
    "beautifulsoup4==4.13.5",
    "lxml>=6.1.0",
    "tiktoken>=0.12.0",
    "starlette>=0.49.1",
    "brotli>=1.2.0",
    "filelock>=3.20.3",
    "orjson>=3.11.5",
    "pillow>=12.2.0",
    "python-multipart>=0.0.26",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.13.1",
    "black>=25.9.0",
    "pre-commit>=4.5.1",
    "pytest-anyio>=0.0.0",
    "virtualenv>=20.36.1",
]
cli = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ankigen = "ankigen.cli:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["ankigen*"]

[tool.pytest.ini_options]
anyio_backend = "asyncio"
